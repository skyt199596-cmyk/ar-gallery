<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARポスターギャラリー</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#14172b;--glass:rgba(20,23,43,.62);--line:rgba(255,255,255,.22);--acc:#ffd166;--acc2:#4cc9f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d0f1f;color:#fff;font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans",Meiryo,sans-serif}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;display:none}
body.cam #cam{display:block}
a-scene{position:fixed!important;inset:0;z-index:1;background:transparent}
#ui{position:fixed;inset:0;z-index:10;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.ctrl{pointer-events:auto}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line)}
#top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#brand{padding:9px 16px;border-radius:999px;font-weight:700;font-size:14px;letter-spacing:.04em}
#exit{width:40px;height:40px;border-radius:50%;color:#fff;font-size:18px;cursor:pointer}
#bar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:999px;width:max-content;max-width:94vw}
#bar button{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:84px;padding:9px 12px;border:0;border-radius:999px;background:transparent;color:#fff;font:700 12px "Noto Sans JP",sans-serif;opacity:.75;cursor:pointer;transition:.25s}
#bar button svg{width:22px;height:22px;fill:currentColor}
#bar button.on{background:linear-gradient(135deg,var(--acc),#ff9f6b);color:var(--ink);opacity:1}
#pad{position:absolute;right:14px;bottom:100px;display:none;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,46px);gap:6px}
body.cam #pad{display:grid}
#pad button{border-radius:14px;border:1px solid var(--line);color:#fff;font-size:16px;touch-action:none}
#pad .u{grid-column:2}
#hint{position:absolute;left:0;right:0;bottom:104px;text-align:center;font-size:12px;opacity:.85;text-shadow:0 1px 6px #000}
/* カード */
#card{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:16px;background:rgba(5,6,16,.45);opacity:0;visibility:hidden;transition:.3s}
#card.show{opacity:1;visibility:visible}
#sheet{width:min(440px,100%);max-height:86vh;overflow:auto;border-radius:26px;background:#fff;color:var(--ink);transform:translateY(40px) scale(.96);transition:.35s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 24px 70px rgba(0,0,0,.5)}
#card.show #sheet{transform:none}
#cardImg{display:block;width:100%;max-height:48vh;object-fit:contain;background:#eef0f7}
#cardBody{padding:18px 22px 22px}
#cardNo{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.14em;color:#fff;background:var(--ink);border-radius:999px;padding:4px 10px}
#cardTitle{margin:10px 0 2px;font-size:22px;font-weight:900;line-height:1.35}
#cardAuthor{margin:0 0 12px;font-size:12px;color:#6b7090}
#cardText{margin:0;font-size:14px;line-height:1.85}
#close{margin-top:18px;width:100%;padding:13px;border:0;border-radius:14px;background:var(--ink);color:#fff;font:700 15px "Noto Sans JP",sans-serif;cursor:pointer}
/* スタート画面 */
#intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px;text-align:center;background:radial-gradient(circle at 20% 15%,#3a2d7a,transparent 55%),radial-gradient(circle at 85% 85%,#0b6e8c,transparent 55%),#0d0f1f;transition:.5s}
#intro.hide{opacity:0;visibility:hidden}
#intro small{letter-spacing:.3em;color:var(--acc);font-weight:700}
#intro h1{margin:0;font-size:clamp(28px,8vw,44px);font-weight:900;line-height:1.3}
#intro p{margin:0;max-width:360px;font-size:14px;line-height:1.9;opacity:.85}
#start{padding:16px 40px;border:0;border-radius:999px;background:linear-gradient(135deg,var(--acc),#ff9f6b);color:var(--ink);font:900 17px "Noto Sans JP",sans-serif;box-shadow:0 10px 34px rgba(255,159,107,.45);cursor:pointer}
#mode{font-size:12px;opacity:.75;line-height:1.7;max-width:340px}
#toast{position:absolute;left:14px;right:14px;top:64px;padding:12px 16px;border-radius:16px;font-size:12px;line-height:1.7;background:rgba(160,40,40,.88);opacity:0;visibility:hidden;transition:.3s;pointer-events:none}
#toast.show{opacity:1;visibility:visible}
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>

<a-scene renderer="alpha:true" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false"
  webxr="optionalFeatures: dom-overlay, local-floor; overlayElement: #ui">
  <a-entity light="type:ambient;intensity:.9"></a-entity>
  <a-entity light="type:directional;intensity:1.1" position="1 4 2"></a-entity>
  <a-entity id="rig"><a-camera position="0 1.6 0" wasd-controls-enabled="false"></a-camera></a-entity>
  <a-entity id="stage"></a-entity>
</a-scene>

<div id="ui">
  <div id="top">
    <div id="brand" class="glass ctrl">🏞 わたしたちのまち AR展</div>
    <button id="exit" class="glass ctrl" aria-label="終了">✕</button>
  </div>
  <div id="toast"></div>
  <div id="hint">歩き回って、気になるポスターをタップ！</div>
  <div id="pad">
    <button class="glass ctrl u" data-m="1,0">▲</button>
    <button class="glass ctrl" data-m="0,-1">◀</button>
    <button class="glass ctrl" data-m="-1,0">▼</button>
    <button class="glass ctrl" data-m="0,1">▶</button>
  </div>
  <div id="bar" class="glass ctrl">
    <button data-layout="circle" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="3.5" r="2.4"/><circle cx="20" cy="9" r="2.4"/><circle cx="17" cy="19" r="2.4"/><circle cx="7" cy="19" r="2.4"/><circle cx="4" cy="9" r="2.4"/></svg>サークル</button>
    <button data-layout="street"><svg viewBox="0 0 24 24"><rect x="3" y="2" width="5" height="5" rx="1"/><rect x="3" y="10" width="5" height="5" rx="1"/><rect x="3" y="18" width="5" height="4" rx="1"/><rect x="16" y="2" width="5" height="5" rx="1"/><rect x="16" y="10" width="5" height="5" rx="1"/><rect x="16" y="18" width="5" height="4" rx="1"/></svg>ストリート</button>
    <button data-layout="grid"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="5.5" height="7" rx="1"/><rect x="9.2" y="3" width="5.5" height="7" rx="1"/><rect x="16.5" y="3" width="5.5" height="7" rx="1"/><rect x="2" y="13" width="5.5" height="7" rx="1"/><rect x="9.2" y="13" width="5.5" height="7" rx="1"/><rect x="16.5" y="13" width="5.5" height="7" rx="1"/></svg>グリッド</button>
  </div>
  <div id="card" class="ctrl">
    <div id="sheet">
      <img id="cardImg" alt="">
      <div id="cardBody">
        <span id="cardNo"></span>
        <h2 id="cardTitle"></h2>
        <p id="cardAuthor"></p>
        <p id="cardText"></p>
        <button id="close">とじる</button>
      </div>
    </div>
  </div>
</div>

<div id="intro">
  <small>AR GALLERY</small>
  <h1>わたしたちのまち<br>ポスター展</h1>
  <p>カメラに映る目の前の空間に、ポスターがふわりと浮かびます。歩きながら、ゆっくり鑑賞してください。</p>
  <button id="start">はじめる</button>
  <div id="mode"></div>
</div>

<script>
/* ==========================================================
   ★ ここだけ書きかえればOK！ ポスターの情報リスト ★
   image : imagesフォルダに入れた画像のファイル名
   ========================================================== */
const POSTERS = [
  { image:"images/poster1.jpg", title:"海辺の朝市",     author:"制作：生徒A", text:"毎週日曜の朝、港に新鮮な魚や野菜がずらりと並びます。地元の人との会話も楽しい、まちの元気スポットです。" },
  { image:"images/poster2.jpg", title:"なつかしの商店街", author:"制作：生徒B", text:"昭和から続くお店が今も営業中。コロッケの香りと店主さんの笑顔が、訪れる人を迎えてくれます。" },
  { image:"images/poster3.jpg", title:"夏祭り",         author:"制作：生徒C", text:"夜空に響く太鼓と色とりどりの提灯。世代をこえてみんなが集まる、まち最大のイベントです。" },
  { image:"images/poster4.jpg", title:"里山の棚田",     author:"制作：生徒D", text:"季節ごとに表情を変える棚田の風景。秋には黄金色の稲穂が一面に広がります。" },
  { image:"images/poster5.jpg", title:"名物グルメ",     author:"制作：生徒E", text:"地元の食材をたっぷり使ったご当地グルメ。ここでしか味わえない一皿をご紹介します。" },
  { image:"images/poster6.jpg", title:"港の夕日",       author:"制作：生徒F", text:"空と海がオレンジに染まる夕暮れ時。写真好きにも人気の、とっておきの絶景ポイントです。" }
];

/* ---------- ここから下は触らなくてOK ---------- */
const SHAPES = ['torus-knot','octahedron','icosahedron','torus','dodecahedron','cone'];
const SCALES = [.2,.3,.28,.17,.28,.15];
const COLORS = ['#ff6b6b','#ffd166','#06d6a0','#4cc9f0','#b388ff','#ff9f1c'];
const W = 1.5, H = 2.12, Y = 1.6;
const $ = s => document.querySelector(s);
const scene = $('a-scene'), stage = $('#stage'), rig = $('#rig');
const nodes = [];
const isIOS = typeof DeviceOrientationEvent !== 'undefined' && !!DeviceOrientationEvent.requestPermission;
const inApp = /Line\/|FBAN|FBAV|Instagram|Twitter|MicroMessenger|; wv\)/i.test(navigator.userAgent);
let xrState = navigator.xr ? '確認中…' : '非対応（このブラウザではWebXRが使えません）';
function diag(){
  $('#mode').innerHTML = 'AR判定：' + xrState
    + (inApp ? '<br>⚠ アプリ内ブラウザです。Chromeで開き直してください' : '')
    + (window.isSecureContext ? '' : '<br>⚠ https:// のアドレスで開いてください');
}
if (navigator.xr) navigator.xr.isSessionSupported('immersive-ar')
  .then(v => { xrState = v ? '対応（歩き回れます）' : '非対応（ARCore未対応の可能性）'; diag(); })
  .catch(() => { xrState = '確認できません'; diag(); });
diag();
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 12000); }

// 画像がまだ無いときは、仮のポスターを自動で作る
function placeholder(p, i){
  const c = document.createElement('canvas'); c.width = 600; c.height = 848;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0,0,600,848);
  gr.addColorStop(0, COLORS[i % 6]); gr.addColorStop(1, '#1b1f3b');
  g.fillStyle = gr; g.fillRect(0,0,600,848);
  g.fillStyle = '#fff'; g.textAlign = 'center';
  g.font = 'bold 54px sans-serif'; g.fillText(p.title, 300, 400);
  g.font = '26px sans-serif'; g.fillText('ここにポスターが入ります', 300, 468);
  return c.toDataURL('image/jpeg', .85);
}
const loadImg = (p, i) => new Promise(r => {
  const im = new Image(); im.onload = () => r(p.image); im.onerror = () => r(placeholder(p, i)); im.src = p.image;
});

async function build(){
  for (let i = 0; i < POSTERS.length; i++){
    const p = POSTERS[i]; p.url = await loadImg(p, i);
    const root = document.createElement('a-entity');
    root.object3D.userData.idx = i;
    root.setAttribute('position', '0 -5 0');

    const bob = document.createElement('a-entity');           // ふわふわ上下
    bob.setAttribute('animation', {property:'position', from:'0 -0.06 0', to:'0 0.06 0', dir:'alternate', loop:true, dur:2200 + i*300, easing:'easeInOutSine'});

    const frame = document.createElement('a-box');             // 白いフレーム
    frame.setAttribute('width', W + .08); frame.setAttribute('height', H + .08); frame.setAttribute('depth', .03);
    frame.setAttribute('position', '0 0 -0.025'); frame.setAttribute('material', {color:'#ffffff', shader:'flat'});

    const img = document.createElement('a-plane');             // ポスター本体
    img.setAttribute('width', W); img.setAttribute('height', H);
    img.setAttribute('material', {src:p.url, shader:'flat'});

    const orb = document.createElement('a-' + SHAPES[i % 6]);  // アイキャッチ3D
    const s = SCALES[i % 6];
    orb.setAttribute('scale', `${s} ${s} ${s}`);
    orb.setAttribute('position', `0 ${H/2 + .55} 0`);
    orb.setAttribute('material', {color:COLORS[i % 6], metalness:.6, roughness:.25});
    orb.setAttribute('animation', {property:'rotation', to:'360 360 0', loop:true, dur:7000, easing:'linear'});

    bob.append(frame, img, orb); root.append(bob); stage.append(root); nodes.push(root);
  }
  place('circle');
}

function moveTo(root, x, y, z, ry){
  const cur = root.object3D.rotation.y * 180 / Math.PI;
  const d = (((ry - cur) % 360) + 540) % 360 - 180;           // 近い回りかたを選ぶ
  root.setAttribute('animation__p', {property:'position', to:`${x} ${y} ${z}`, dur:1100, easing:'easeInOutCubic'});
  root.setAttribute('animation__r', {property:'rotation', to:`0 ${cur + d} 0`, dur:1100, easing:'easeInOutCubic'});
}

function place(name){
  const n = nodes.length;
  nodes.forEach((root, i) => {
    let x, z, ry;
    if (name === 'circle'){                                    // 360度囲む
      const t = i * 360 / n, r = Math.max(3.5, n * .6), a = t * Math.PI / 180;
      x = r * Math.sin(a); z = -r * Math.cos(a); ry = -t;
    } else if (name === 'street'){                             // 通路の両脇
      const left = i % 2 === 0;
      x = left ? -2.2 : 2.2; z = -3 - Math.floor(i / 2) * 3; ry = left ? 90 : -90;
    } else {                                                   // 整列グリッド
      x = (i % 3 - 1) * 2.6; z = -4 - Math.floor(i / 3) * 3.2; ry = 0;
    }
    moveTo(root, x, Y, z, ry);
  });
}

document.querySelectorAll('#bar button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#bar button').forEach(o => o.classList.toggle('on', o === b));
  place(b.dataset.layout);
});

/* ---------- タップでカード表示 ---------- */
function openCard(i){
  const p = POSTERS[i];
  $('#cardImg').src = p.url; $('#cardNo').textContent = 'No.' + String(i + 1).padStart(2, '0');
  $('#cardTitle').textContent = p.title; $('#cardAuthor').textContent = p.author; $('#cardText').textContent = p.text;
  $('#card').classList.add('show');
}
$('#close').onclick = () => $('#card').classList.remove('show');
$('#card').addEventListener('click', e => { if (e.target.id === 'card') $('#card').classList.remove('show'); });

const T = AFRAME.THREE, ray = new T.Raycaster(), v2 = new T.Vector2();
let down = null;
addEventListener('pointerdown', e => down = {x:e.clientX, y:e.clientY});
addEventListener('pointerup', e => {
  if (!down || e.target.closest('.ctrl')) { down = null; return; }
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
  if (moved > 10 || !scene.camera) return;
  v2.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(v2, scene.camera);
  const hits = ray.intersectObjects(nodes.map(n => n.object3D), true);
  for (const h of hits){
    let o = h.object; while (o && o.userData.idx === undefined) o = o.parent;
    if (o){ openCard(o.userData.idx); break; }
  }
});
document.querySelectorAll('.ctrl').forEach(el => el.addEventListener('beforexrselect', e => e.preventDefault()));

/* ---------- 歩く（カメラモード用の移動ボタン） ---------- */
let mv = [0, 0], last = performance.now();
const dv = new T.Vector3(), rt = new T.Vector3();
document.querySelectorAll('#pad button').forEach(b => {
  const set = v => () => mv = v;
  b.addEventListener('pointerdown', set(b.dataset.m.split(',').map(Number)));
  ['pointerup','pointerleave','pointercancel'].forEach(ev => b.addEventListener(ev, set([0,0])));
});
(function loop(t){
  const dt = Math.min((t - last) / 1000, .1); last = t;
  if ((mv[0] || mv[1]) && scene.camera){
    scene.camera.getWorldDirection(dv); dv.y = 0; dv.normalize();
    rt.set(-dv.z, 0, dv.x);
    rig.object3D.position.addScaledVector(dv, mv[0] * dt * 1.6).addScaledVector(rt, mv[1] * dt * 1.6);
  }
  requestAnimationFrame(loop);
})(last);

/* ---------- スタート ---------- */
async function startCamera(){
  try{
    const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false});
    $('#cam').srcObject = s; await $('#cam').play();
  }catch(e){ alert('カメラを使えませんでした。ブラウザのカメラ許可を確認してください。'); }
  document.body.classList.add('cam');
}
$('#start').onclick = async () => {
  const hide = () => $('#intro').classList.add('hide');
  if (isIOS){                                              // iPhone：歩き回りARは不可
    try{ await DeviceOrientationEvent.requestPermission(); }catch(e){}
    await startCamera(); hide(); return;
  }
  if (navigator.xr){                                       // Android：まずARモードに挑戦
    try{
      await scene.enterAR();
      if (!scene.is('ar-mode')) throw new Error('ARセッションが始まりませんでした');
      hide(); return;
    }catch(e){
      toast('ARモードを開始できませんでした（' + (e.name || 'Error') + '：' + (e.message || e) + '）。'
        + 'Chromeを最新版にし、「Google Play 開発者サービス for AR」をインストールしてから、もう一度お試しください。今回はカメラ＋ジャイロモードで表示します。');
    }
  } else {
    toast('このブラウザは歩き回りARに対応していません。カメラ＋ジャイロモードで表示します。');
  }
  await startCamera(); hide();
};
scene.addEventListener('exit-vr', () => location.reload());
$('#exit').onclick = () => scene.is('ar-mode') ? scene.exitVR() : location.reload();

scene.hasLoaded ? build() : scene.addEventListener('loaded', build);
</script>
</body>
</html>
