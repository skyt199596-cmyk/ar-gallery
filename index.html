<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARポスターギャラリー</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#14172b;--glass:rgba(20,23,43,.62);--line:rgba(255,255,255,.22);--acc:#ffd166;--acc2:#4cc9f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d0f1f;color:#fff;font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans",Meiryo,sans-serif}
/* A-Frame標準のVR/ARボタンは使わない（自前のボタンで開始する） */
.a-enter-vr,.a-enter-ar,.a-orientation-modal{display:none!important}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;display:none}
body.cam #cam{display:block}
a-scene{position:fixed!important;inset:0;z-index:1;background:transparent}
#ui{position:fixed;inset:0;z-index:10;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.ctrl{pointer-events:auto}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line)}
#top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#brand{padding:9px 16px;border-radius:999px;font-weight:700;font-size:14px;letter-spacing:.04em}
#tr{display:flex;gap:8px}
#exit,#stickBtn{width:40px;height:40px;border-radius:50%;color:#fff;font-size:18px;cursor:pointer;padding:0}
#modeChip{position:absolute;left:16px;top:58px;font-size:11px;opacity:.9;text-shadow:0 1px 6px #000}
#side{position:absolute;right:16px;bottom:112px;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
#side button{padding:12px 16px;border-radius:999px;color:#fff;font:700 13px "Noto Sans JP",sans-serif;cursor:pointer}
#backBtn{display:none}body.cam #backBtn{display:block}
#backBtn.on{background:linear-gradient(135deg,var(--acc),#ff9f6b);color:var(--ink);border-color:transparent}
#stepBtn{display:none;height:40px;padding:0 14px;border-radius:999px;color:#fff;font:700 13px "Noto Sans JP",sans-serif;cursor:pointer}
body.cam #stepBtn{display:block}#stepBtn.off{opacity:.5}
#bar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:999px;width:max-content;max-width:94vw}
#bar button{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:84px;padding:9px 12px;border:0;border-radius:999px;background:transparent;color:#fff;font:700 12px "Noto Sans JP",sans-serif;opacity:.75;cursor:pointer;transition:.25s}
#bar button svg{width:22px;height:22px;fill:currentColor}
#bar button.on{background:linear-gradient(135deg,var(--acc),#ff9f6b);color:var(--ink);opacity:1}
#hint{position:absolute;left:0;right:0;top:84px;text-align:center;font-size:12px;opacity:.9;text-shadow:0 1px 6px #000;animation:fade 1s 9s forwards}
@keyframes fade{to{opacity:0}}
#stick{position:absolute;left:22px;bottom:112px;width:132px;height:132px;border-radius:50%;display:none;touch-action:none;background:radial-gradient(circle,rgba(255,255,255,.10) 0 38%,rgba(20,23,43,.55) 39%);border:1.5px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
body.stick #stick{display:block}
#stick::before{content:'';position:absolute;inset:14px;border-radius:50%;border:1px dashed rgba(255,255,255,.25)}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:linear-gradient(135deg,var(--acc),#ff9f6b);box-shadow:0 6px 18px rgba(0,0,0,.45);pointer-events:none}
#stickLabel{position:absolute;left:22px;bottom:250px;width:132px;text-align:center;font-size:11px;opacity:.8;display:none;text-shadow:0 1px 6px #000}body.stick #stickLabel{display:block}
/* カード */
#card{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:16px;background:rgba(5,6,16,.45);opacity:0;visibility:hidden;transition:.3s}
#card.show{opacity:1;visibility:visible}
#sheet{width:min(440px,100%);max-height:86vh;overflow:auto;border-radius:26px;background:#fff;color:var(--ink);transform:translateY(40px) scale(.96);transition:.35s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 24px 70px rgba(0,0,0,.5)}
#card.show #sheet{transform:none}
#cardImg{display:block;width:100%;max-height:48vh;object-fit:contain;background:#eef0f7}
#cardBody{padding:18px 22px 22px}
#cardNo{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.14em;color:#fff;background:var(--ink);border-radius:999px;padding:4px 10px}
#cardTitle{margin:10px 0 2px;font-size:22px;font-weight:900;line-height:1.35}
#cardAuthor{margin:0 0 12px;font-size:12px;color:#6b7090}
#cardText{margin:0;font-size:14px;line-height:1.85}
#close{margin-top:18px;width:100%;padding:13px;border:0;border-radius:14px;background:var(--ink);color:#fff;font:700 15px "Noto Sans JP",sans-serif;cursor:pointer}
/* スタート画面 */
#intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px;text-align:center;background:radial-gradient(circle at 20% 15%,#3a2d7a,transparent 55%),radial-gradient(circle at 85% 85%,#0b6e8c,transparent 55%),#0d0f1f;transition:.5s}
#intro.hide{opacity:0;visibility:hidden}
#intro small{letter-spacing:.3em;color:var(--acc);font-weight:700}
#intro h1{margin:0;font-size:clamp(28px,8vw,44px);font-weight:900;line-height:1.3}
#intro p{margin:0;max-width:360px;font-size:14px;line-height:1.9;opacity:.85}
#start{padding:16px 40px;border:0;border-radius:999px;background:linear-gradient(135deg,var(--acc),#ff9f6b);color:var(--ink);font:900 17px "Noto Sans JP",sans-serif;box-shadow:0 10px 34px rgba(255,159,107,.45);cursor:pointer}
#mode{font-size:12px;opacity:.75;line-height:1.7;max-width:340px}
#toast{position:absolute;left:14px;right:14px;top:118px;padding:12px 16px;border-radius:16px;font-size:12px;line-height:1.7;background:rgba(160,40,40,.88);opacity:0;visibility:hidden;transition:.3s;pointer-events:auto}
#toast.show{opacity:1;visibility:visible}
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>

<a-scene renderer="alpha:true" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false"
  webxr="referenceSpaceType: local; requiredFeatures: local; optionalFeatures: dom-overlay; overlayElement: #ui">
  <a-entity light="type:ambient;intensity:.9"></a-entity>
  <a-entity light="type:directional;intensity:1.1" position="1 4 2"></a-entity>
  <a-entity id="rig"><a-camera id="camEl" position="0 1.6 0" wasd-controls-enabled="false"></a-camera></a-entity>
  <a-entity id="stage"></a-entity>
</a-scene>

<div id="ui">
  <div id="top">
    <div id="brand" class="glass ctrl">🏞 わたしたちのまち AR展</div>
    <div id="tr"><button id="stepBtn" class="glass ctrl">👣 0歩</button><button id="stickBtn" class="glass ctrl" aria-label="スティック">🕹</button><button id="exit" class="glass ctrl" aria-label="終了">✕</button></div>
  </div>
  <div id="toast" class="ctrl"></div>
  <div id="hint">歩き回って、気になるポスターをタップ！</div>
  <div id="stickLabel">スティックで移動</div>
  <div id="stick" class="ctrl"><div id="knob"></div></div>
  <div id="modeChip"></div>
  <div id="side">
    <button id="backBtn" class="glass ctrl">⇣ 後退</button>
    <button id="recBtn" class="glass ctrl">🧭 再配置</button>
  </div>
  <div id="bar" class="glass ctrl">
    <button data-layout="circle" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="3.5" r="2.4"/><circle cx="20" cy="9" r="2.4"/><circle cx="17" cy="19" r="2.4"/><circle cx="7" cy="19" r="2.4"/><circle cx="4" cy="9" r="2.4"/></svg>サークル</button>
    <button data-layout="street"><svg viewBox="0 0 24 24"><rect x="3" y="2" width="5" height="5" rx="1"/><rect x="3" y="10" width="5" height="5" rx="1"/><rect x="3" y="18" width="5" height="4" rx="1"/><rect x="16" y="2" width="5" height="5" rx="1"/><rect x="16" y="10" width="5" height="5" rx="1"/><rect x="16" y="18" width="5" height="4" rx="1"/></svg>ストリート</button>
    <button data-layout="grid"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="5.5" height="7" rx="1"/><rect x="9.2" y="3" width="5.5" height="7" rx="1"/><rect x="16.5" y="3" width="5.5" height="7" rx="1"/><rect x="2" y="13" width="5.5" height="7" rx="1"/><rect x="9.2" y="13" width="5.5" height="7" rx="1"/><rect x="16.5" y="13" width="5.5" height="7" rx="1"/></svg>グリッド</button>
  </div>
  <div id="card" class="ctrl">
    <div id="sheet">
      <img id="cardImg" alt="">
      <div id="cardBody">
        <span id="cardNo"></span>
        <h2 id="cardTitle"></h2>
        <p id="cardAuthor"></p>
        <p id="cardText"></p>
        <button id="close">とじる</button>
      </div>
    </div>
  </div>
</div>

<div id="intro">
  <small>AR GALLERY</small>
  <h1>わたしたちのまち<br>ポスター展</h1>
  <p>カメラに映る目の前の空間に、ポスターがふわりと浮かびます。歩きながら、ゆっくり鑑賞してください。</p>
  <button id="start">はじめる</button>
  <div id="mode"></div>
</div>

<script>
/* ==========================================================
   ★ ここだけ書きかえればOK！ ポスターの情報リスト ★
   image : imagesフォルダに入れた画像のファイル名
   ========================================================== */
const POSTERS = [
  { image:"images/poster1.jpg", title:"海辺の朝市",     author:"制作：生徒A", text:"毎週日曜の朝、港に新鮮な魚や野菜がずらりと並びます。地元の人との会話も楽しい、まちの元気スポットです。" },
  { image:"images/poster2.jpg", title:"なつかしの商店街", author:"制作：生徒B", text:"昭和から続くお店が今も営業中。コロッケの香りと店主さんの笑顔が、訪れる人を迎えてくれます。" },
  { image:"images/poster3.jpg", title:"夏祭り",         author:"制作：生徒C", text:"夜空に響く太鼓と色とりどりの提灯。世代をこえてみんなが集まる、まち最大のイベントです。" },
  { image:"images/poster4.jpg", title:"里山の棚田",     author:"制作：生徒D", text:"季節ごとに表情を変える棚田の風景。秋には黄金色の稲穂が一面に広がります。" },
  { image:"images/poster5.jpg", title:"名物グルメ",     author:"制作：生徒E", text:"地元の食材をたっぷり使ったご当地グルメ。ここでしか味わえない一皿をご紹介します。" },
  { image:"images/poster6.jpg", title:"港の夕日",       author:"制作：生徒F", text:"空と海がオレンジに染まる夕暮れ時。写真好きにも人気の、とっておきの絶景ポイントです。" }
];

/* ---------- ここから下は触らなくてOK ---------- */
const SHAPES = ['torus-knot','octahedron','icosahedron','torus','dodecahedron','cone'];
const SCALES = [.2,.3,.28,.17,.28,.15];
const COLORS = ['#ff6b6b','#ffd166','#06d6a0','#4cc9f0','#b388ff','#ff9f1c'];
const W = 1.5, H = 2.12, Y = 1.6;
const GAP = 1;   // 並べる間隔の倍率。1＝標準、小さいほど詰まる（0.8まで）、大きいほど広がる

// 空間に浮かべる大きな3Dオブジェクト：[角度(0=正面), 距離(m), 高さ(m), 形, 大きさ(m), 色, 見た目(solid／wire＝ワイヤー／glass＝すけすけ)]
const FLOATERS = [
  [  28, 8.5, 2.8, 'torus-knot',   .9, '#ff6b6b', 'solid'],
  [ -42, 7.2, 1.8, 'icosahedron', 1.0, '#4cc9f0', 'wire' ],
  [  75, 5.5, 3.0, 'octahedron',   .9, '#ffd166', 'solid'],
  [ 110, 7.5, 2.2, 'torus',        .8, '#b388ff', 'solid'],
  [ 160, 6.0, 3.2, 'dodecahedron', .9, '#06d6a0', 'glass'],
  [-150, 7.0, 1.4, 'torus-knot',   .8, '#ff9f1c', 'wire' ],
  [ -95, 6.0, 2.8, 'sphere',       .8, '#4cc9f0', 'glass'],
  [ -60, 9.0, 4.0, 'icosahedron', 1.4, '#b388ff', 'solid'],
  [   0, 9.5, 3.4, 'cone',         .7, '#ff6b6b', 'solid'],
  [  40, 3.8, 4.7, 'torus',        .6, '#ffd166', 'glass'],
  [-120, 3.8, 4.5, 'octahedron',   .7, '#06d6a0', 'wire' ],
  [ 180, 4.8, 2.0, 'torus-knot',   .7, '#4cc9f0', 'solid'],
  [ 135, 9.0, 1.2, 'dodecahedron',1.2, '#ff9f1c', 'solid']
];
const $ = s => document.querySelector(s);
const scene = $('a-scene'), stage = $('#stage'), rig = $('#rig');
const nodes = [];
// iPhone/iPadの判定（AndroidのChromeにも requestPermission があるため、機能ではなく機種名で判定する）
const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (/Macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
const inApp = /Line\/|FBAN|FBAV|Instagram|Twitter|MicroMessenger|; wv\)/i.test(navigator.userAgent);
let xrState = navigator.xr ? '確認中…' : '非対応（このブラウザではWebXRが使えません）';
function diag(){
  $('#mode').innerHTML = 'AR判定：' + xrState + '<br>ビルド番号：9'
    + (inApp ? '<br>⚠ アプリ内ブラウザです。Chromeで開き直してください' : '')
    + (window.isSecureContext ? '' : '<br>⚠ https:// のアドレスで開いてください');
}
if (navigator.xr) navigator.xr.isSessionSupported('immersive-ar')
  .then(v => { xrState = v ? '対応（歩き回れます）' : '非対応（ARCore未対応の可能性）'; diag(); })
  .catch(() => { xrState = '確認できません'; diag(); });
diag();
let toastTm;
function toast(msg, sticky){
  const t = $('#toast'); t.textContent = msg + (sticky ? '（タップで閉じる）' : ''); t.classList.add('show');
  clearTimeout(toastTm); if (!sticky) toastTm = setTimeout(() => t.classList.remove('show'), 12000);
}
$('#toast').onclick = () => $('#toast').classList.remove('show');
function showHint(text){ const h = $('#hint'); h.textContent = text; h.style.animation = 'none'; void h.offsetWidth; h.style.animation = ''; }

// 画像がまだ無いときは、仮のポスターを自動で作る
function placeholder(p, i){
  const c = document.createElement('canvas'); c.width = 600; c.height = 848;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0,0,600,848);
  gr.addColorStop(0, COLORS[i % 6]); gr.addColorStop(1, '#1b1f3b');
  g.fillStyle = gr; g.fillRect(0,0,600,848);
  g.fillStyle = '#fff'; g.textAlign = 'center';
  g.font = 'bold 54px sans-serif'; g.fillText(p.title, 300, 400);
  g.font = '26px sans-serif'; g.fillText('ここにポスターが入ります', 300, 468);
  return c.toDataURL('image/jpeg', .85);
}
const loadImg = (p, i) => new Promise(r => {
  const im = new Image(); im.onload = () => r(p.image); im.onerror = () => r(placeholder(p, i)); im.src = p.image;
});

async function build(){
  for (let i = 0; i < POSTERS.length; i++){
    const p = POSTERS[i]; p.url = await loadImg(p, i);
    const root = document.createElement('a-entity');
    root.object3D.userData.idx = i;
    root.setAttribute('position', '0 -5 0');

    const bob = document.createElement('a-entity');           // ふわふわ上下
    bob.setAttribute('animation', {property:'position', from:'0 -0.06 0', to:'0 0.06 0', dir:'alternate', loop:true, dur:2200 + i*300, easing:'easeInOutSine'});

    const frame = document.createElement('a-box');             // 白いフレーム
    frame.setAttribute('width', W + .08); frame.setAttribute('height', H + .08); frame.setAttribute('depth', .03);
    frame.setAttribute('position', '0 0 -0.025'); frame.setAttribute('material', {color:'#ffffff', shader:'flat'});

    const img = document.createElement('a-plane');             // ポスター本体
    img.setAttribute('width', W); img.setAttribute('height', H);
    img.setAttribute('material', {src:p.url, shader:'flat'});

    const orb = document.createElement('a-' + SHAPES[i % 6]);  // アイキャッチ3D
    const s = SCALES[i % 6];
    orb.setAttribute('scale', `${s} ${s} ${s}`);
    orb.setAttribute('position', `0 ${H/2 + .55} 0`);
    orb.setAttribute('material', {color:COLORS[i % 6], metalness:.6, roughness:.25});
    orb.setAttribute('animation', {property:'rotation', to:'360 360 0', loop:true, dur:7000, easing:'linear'});

    bob.append(frame, img, orb); root.append(bob); stage.append(root); nodes.push(root);
  }
  place('circle');
  buildFloaters();
}

const FIX = {torus:.5, cone:.5};                    // 形ごとの大きさ補正
function buildFloaters(){
  const g = document.createElement('a-entity'); stage.append(g);
  FLOATERS.forEach(([deg, r, y, shape, size, color, look], i) => {
    const a = deg * Math.PI / 180, sc = size * (FIX[shape] || 1);
    const root = document.createElement('a-entity');
    root.setAttribute('position', `${r * Math.sin(a)} ${y} ${-r * Math.cos(a)}`);
    const bob = document.createElement('a-entity');            // ふわふわ上下
    bob.setAttribute('animation', {property:'position', from:'0 -0.25 0', to:'0 0.25 0', dir:'alternate', loop:true, dur:3000 + i*370, easing:'easeInOutSine'});
    const o = document.createElement('a-' + shape);
    o.setAttribute('scale', '0.001 0.001 0.001');
    o.setAttribute('animation__in', {property:'scale', to:`${sc} ${sc} ${sc}`, dur:1400, delay:600 + i*150, easing:'easeOutBack'});
    o.setAttribute('animation__spin', {property:'rotation', to:'360 360 0', loop:true, dur:14000 + i*1700, easing:'linear'});
    o.setAttribute('material', {color, metalness:.5, roughness:.3, emissive:color, emissiveIntensity: look === 'wire' ? .8 : .15,
                                wireframe: look === 'wire', transparent: look === 'glass', opacity: look === 'glass' ? .55 : 1});
    bob.append(o); root.append(bob); g.append(root);
  });
}

function moveTo(root, x, y, z, ry){
  const cur = root.object3D.rotation.y * 180 / Math.PI;
  const d = (((ry - cur) % 360) + 540) % 360 - 180;           // 近い回りかたを選ぶ
  root.setAttribute('animation__p', {property:'position', to:`${x} ${y} ${z}`, dur:1100, easing:'easeInOutCubic'});
  root.setAttribute('animation__r', {property:'rotation', to:`0 ${cur + d} 0`, dur:1100, easing:'easeInOutCubic'});
}

function place(name){
  const n = nodes.length;
  nodes.forEach((root, i) => {
    let x, z, ry;
    if (name === 'circle'){                                    // 360度囲む
      const t = i * 360 / n, r = Math.max(2.5, n * .45) * GAP, a = t * Math.PI / 180;
      x = r * Math.sin(a); z = -r * Math.cos(a); ry = -t;
    } else if (name === 'street'){                             // 通路の両脇
      const left = i % 2 === 0;
      x = (left ? -1.7 : 1.7) * GAP; z = -2.4 * GAP - Math.floor(i / 2) * 2.2 * GAP; ry = left ? 90 : -90;
    } else {                                                   // 整列グリッド
      x = (i % 3 - 1) * 2.0 * GAP; z = -3 * GAP - Math.floor(i / 3) * 2.6 * GAP; ry = 0;
    }
    moveTo(root, x, Y, z, ry);
  });
}

document.querySelectorAll('#bar button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#bar button').forEach(o => o.classList.toggle('on', o === b));
  place(b.dataset.layout);
});

/* ---------- タップでカード表示 ---------- */
function openCard(i){
  const p = POSTERS[i];
  $('#cardImg').src = p.url; $('#cardNo').textContent = 'No.' + String(i + 1).padStart(2, '0');
  $('#cardTitle').textContent = p.title; $('#cardAuthor').textContent = p.author; $('#cardText').textContent = p.text;
  $('#card').classList.add('show');
}
$('#close').onclick = () => $('#card').classList.remove('show');
$('#card').addEventListener('click', e => { if (e.target.id === 'card') $('#card').classList.remove('show'); });

const T = AFRAME.THREE, ray = new T.Raycaster(), v2 = new T.Vector2();
let down = null;
addEventListener('pointerdown', e => down = {x:e.clientX, y:e.clientY});
addEventListener('pointerup', e => {
  if (!down || e.target.closest('.ctrl')) { down = null; return; }
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
  if (moved > 10 || !scene.camera) return;
  v2.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(v2, scene.camera);
  const hits = ray.intersectObjects(nodes.map(n => n.object3D), true);
  for (const h of hits){
    let o = h.object; while (o && o.userData.idx === undefined) o = o.parent;
    if (o){ openCard(o.userData.idx); break; }
  }
});
document.querySelectorAll('.ctrl').forEach(el => el.addEventListener('beforexrselect', e => e.preventDefault()));

/* ---------- 歩く（カメラモード用の移動ボタン） ---------- */
let mv = [0, 0], last = performance.now();
const dv = new T.Vector3(), rt = new T.Vector3();
const stick = $('#stick'), knob = $('#knob'); let sid = null;
function stickMove(e){
  const r = stick.getBoundingClientRect(), R = r.width / 2, lim = R - 14;
  let dx = e.clientX - (r.left + R), dy = e.clientY - (r.top + R);
  const d = Math.hypot(dx, dy), k = d > lim ? lim / d : 1; dx *= k; dy *= k;
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  mv = [-dy / lim, dx / lim];                       // [前後, 左右]（0〜1でゆっくり〜速く）
}
stick.addEventListener('pointerdown', e => { sid = e.pointerId; stick.setPointerCapture(sid); stickMove(e); });
stick.addEventListener('pointermove', e => { if (e.pointerId === sid) stickMove(e); });
['pointerup','pointercancel','lostpointercapture'].forEach(ev => stick.addEventListener(ev, e => {
  if (e.pointerId !== sid) return; sid = null; mv = [0, 0]; knob.style.transform = '';
}));
$('#stickBtn').onclick = () => document.body.classList.toggle('stick');
/* ---------- 歩数連動（加速度センサーで「歩いた」を検知して前に進む） ---------- */
const STEP_LENGTH = 0.9;      // 1歩で進む距離(m)。大きくすると速く進む（カメラ＋センサーモード用）
const STEP_THRESHOLD = 0.9;   // 検知の感度。小さいほど敏感（目安 0.6〜1.5）
let stepOn = true, backMode = false, steps = 0, base = 9.8, sm = 0, armed = true, lastStep = 0, motionSeen = false;
const pending = new T.Vector3(), lastHeading = new T.Vector3(0, 0, -1);
const stepLabel = () => $('#stepBtn').textContent = '👣 ' + (stepOn ? steps + '歩' : 'OFF');
function doStep(){
  steps++; stepLabel();
  if (!scene.camera) return;
  scene.camera.getWorldDirection(dv); dv.y = 0;                    // 向いている方向へ進む
  if (dv.length() < .25) dv.copy(lastHeading); else { dv.normalize(); lastHeading.copy(dv); }
  pending.addScaledVector(dv, backMode ? -STEP_LENGTH : STEP_LENGTH);
}
function onMotion(e){
  if (!document.body.classList.contains('cam')) return;
  const a = e.accelerationIncludingGravity || e.acceleration;
  if (!a || a.x == null) return;
  motionSeen = true;
  const m = Math.hypot(a.x, a.y, a.z);
  base += (m - base) * 0.02;                                        // ゆっくり追従する基準（重力）
  sm = sm * 0.6 + (m - base) * 0.4;                                 // ノイズをならす
  const t = performance.now();
  if (armed && sm > STEP_THRESHOLD && t - lastStep > 320){ armed = false; lastStep = t; if (stepOn) doStep(); }
  else if (!armed && sm < STEP_THRESHOLD * .3) armed = true;
}
addEventListener('devicemotion', onMotion);
$('#stepBtn').onclick = () => { stepOn = !stepOn; $('#stepBtn').classList.toggle('off', !stepOn); stepLabel(); };
let arWatch = null; const wp = new T.Vector3();
$('#backBtn').onclick = () => {                       // ON中は、歩くと後ろに下がる
  backMode = !backMode; const b = $('#backBtn');
  b.classList.toggle('on', backMode); b.textContent = backMode ? '⇣ 後退中' : '⇣ 後退';
};
/* ---------- 再配置：いま立っている場所・向いている方向を「ギャラリーの正面」にする ---------- */
function recenter(instant){
  if (!scene.camera) return;
  scene.camera.getWorldPosition(wp); scene.camera.getWorldDirection(dv); dv.y = 0;
  if (dv.length() < .25) dv.copy(lastHeading); else dv.normalize();
  const yaw = Math.atan2(-dv.x, -dv.z) * 180 / Math.PI;
  if (instant){ stage.object3D.position.set(wp.x, 0, wp.z); stage.object3D.rotation.y = yaw * Math.PI / 180; }
  else moveTo(stage, wp.x, 0, wp.z, yaw);
}
$('#recBtn').onclick = () => { recenter(false); toast('いま向いている方向を正面に、ギャラリーを置き直しました'); };
const setMode = t => $('#modeChip').textContent = t;
(function loop(t){
  const dt = Math.min((t - last) / 1000, .1); last = t;
  if (pending.lengthSq() > 1e-6){                    // 1歩ぶんをなめらかに進める
    const k = Math.min(1, dt * 5);
    rig.object3D.position.addScaledVector(pending, k); pending.multiplyScalar(1 - k);
  }
  if ((mv[0] || mv[1]) && scene.camera){
    scene.camera.getWorldDirection(dv); dv.y = 0; dv.normalize();
    rt.set(-dv.z, 0, dv.x);
    rig.object3D.position.addScaledVector(dv, mv[0] * dt * 1.6).addScaledVector(rt, mv[1] * dt * 1.6);
  }
  if (arWatch && scene.camera){                      // ARで位置が動いているかの見張り
    scene.camera.getWorldPosition(wp);
    if (!arWatch.p0) arWatch.p0 = wp.clone();
    arWatch.max = Math.max(arWatch.max, wp.distanceTo(arWatch.p0));
    if (t - arWatch.t0 > 7000){
      if (arWatch.max < 1e-4){
        toast('スマホの位置が追跡できていません。ARCoreが動作していない可能性があります。画面左下のスティックで移動できます。');
        document.body.classList.add('stick');
      }
      arWatch = null;
    }
  }
  requestAnimationFrame(loop);
})(last);

/* ---------- スタート ---------- */
async function startCamera(){
  try{
    const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false});
    $('#cam').srcObject = s; await $('#cam').play();
  }catch(e){ alert('カメラを使えませんでした。ブラウザのカメラ許可を確認してください。'); }
  document.body.classList.add('cam', 'stick');
  showHint('実際に歩くと、歩数に合わせて前に進みます（スティックでも移動できます）');
  setTimeout(() => recenter(true), 700);               // 最初に向いている方向を正面にする
  setTimeout(() => { if (!motionSeen) toast('モーションセンサーが使えません。スティックで移動してください。', true); }, 4000);
}
// WebXRの失敗理由をつかまえる（A-Frame側では失敗が見えないため）
let xrFail = null;
if (navigator.xr){
  const orig = navigator.xr.requestSession.bind(navigator.xr);
  navigator.xr.requestSession = (m, i) => orig(m, i).catch(e => { if (xrFail) xrFail(e); throw e; });
}
function enterAR(){
  return new Promise((res, rej) => {
    const done = () => { scene.removeEventListener('enter-vr', ok); xrFail = null; };
    const ok = () => { done(); res(); };
    const ng = e => { done(); rej(e); };
    xrFail = ng; scene.addEventListener('enter-vr', ok);
    try{ Promise.resolve(scene.enterAR()).catch(ng); }catch(e){ ng(e); }
  });
}
scene.addEventListener('enter-vr', () => {              // ARが始まったとき
  if (!scene.xrSession) return;
  document.body.classList.add('ar');
  $('#intro').classList.add('hide');
  $('#camEl').object3D.position.set(0, 0, 0);           // 目の高さはスマホの位置で決まる
  rig.object3D.position.set(0, 1.4, 0);                 // 床からの目の高さの目安(m)
  arWatch = {t0: performance.now(), p0: null, max: 0};
  setMode('● ARモード（位置追跡あり）');
  setTimeout(() => recenter(true), 1500);
});
$('#start').onclick = async () => {
  const hide = () => $('#intro').classList.add('hide');
  if (isIOS){                                           // iPhone：歩き回りARは不可
    const reqs = [DeviceOrientationEvent.requestPermission()];
    if (typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission) reqs.push(DeviceMotionEvent.requestPermission());
    try{ await Promise.all(reqs); }catch(e){}
    setMode('● カメラ＋センサーモード（iPhoneはAR非対応）');
    await startCamera(); hide(); return;
  }
  if (navigator.xr){                                    // Android：まずARモードに挑戦
    try{ await enterAR(); return; }
    catch(e){
      setMode('● カメラ＋センサーモード（AR開始に失敗）');
      toast('ARモードを開始できませんでした（' + (e.name || 'Error') + '：' + (e.message || e) + '）。'
        + 'Chromeを最新版にし、「Google Play 開発者サービス for AR」を入れてから、もう一度お試しください。今回はカメラ＋ジャイロモードで表示します。', true);
    }
  } else {
    setMode('● カメラ＋センサーモード（このブラウザはAR非対応）');
    toast('このブラウザは歩き回りARに対応していません。カメラ＋ジャイロモードで表示します。', true);
  }
  await startCamera(); hide();
};
scene.addEventListener('exit-vr', () => location.reload());
$('#exit').onclick = () => scene.xrSession ? scene.exitVR() : location.reload();

scene.hasLoaded ? build() : scene.addEventListener('loaded', build);
</script>
</body>
</html>
